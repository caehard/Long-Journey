<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deckbuilder Long Journey</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/mesa.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  header.topo input[type=text] { width: 240px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 400px; }

  /* acervo */
  .acervo { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--linha); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--linha); }
  .filtros input[type=text] { width: 220px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--fundo-2); border: 1px solid var(--linha); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
  .chip.ativo { background: var(--prata); color: #15181f; border-color: var(--prata); font-weight: 700; }
  .chip .bolinha { margin-right: 4px; }
  .grade { flex: 1; overflow-y: auto; padding: 14px 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .item-acervo { position: relative; cursor: pointer; aspect-ratio: 630 / 880; border-radius: 6px; }
  .item-acervo:hover { outline: 2px solid var(--prata); outline-offset: 2px; }
  .item-acervo.fora { opacity: .4; cursor: not-allowed; }
  .item-acervo .qtd { position: absolute; right: -6px; top: -6px; min-width: 26px; height: 26px; border-radius: 13px; background: var(--prata); color: #15181f; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .vazio-acervo { color: var(--cinza); grid-column: 1 / -1; }

  /* deck */
  .deck { overflow-y: auto; padding: 14px 16px 60px; }
  .deck h2 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--prata); margin: 18px 0 8px; display: flex; gap: 8px; }
  .deck h2 .dica { text-transform: none; letter-spacing: 0; font-family: "Source Sans 3"; font-weight: 400; }
  .medidor { background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; }
  .medidor .valor { font: 700 26px "Cinzel", serif; color: var(--prata-clara); }
  .medidor .valor.passou { color: var(--erro); }
  .barra { height: 8px; border-radius: 4px; background: var(--fundo-2); overflow: hidden; margin-top: 6px; }
  .barra div { height: 100%; background: var(--prata); }
  .barra div.passou { background: var(--erro); }
  .slot { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; min-height: 76px; }
  .slot .mini { width: 46px; height: 64px; }
  .slot .rotulo { font-size: 11px; color: var(--cinza); text-transform: uppercase; letter-spacing: 1px; }
  .slot .nome { font-weight: 700; }
  .slot.vazio .nome { color: var(--cinza); font-weight: 400; font-style: italic; }
  .slot select { width: 100%; padding: 3px 6px; font-size: 13px; }
  .linha-deck { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; }
  .linha-deck:hover { background: var(--painel); }
  .linha-deck .ctrl { display: inline-flex; align-items: center; gap: 4px; }
  .linha-deck .ctrl button { width: 24px; height: 24px; padding: 0; border-radius: 5px; }
  .linha-deck .n { width: 18px; text-align: center; font-weight: 700; }
  .linha-deck .info { font-size: 12px; color: var(--cinza); white-space: nowrap; }
  .bolinhas { display: inline-flex; gap: 3px; vertical-align: middle; }
  .bolinha { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
  .conferencia { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .conferencia li { padding: 3px 0; }
  .conferencia li::before { margin-right: 6px; }
  .conferencia li.erro::before { content: "✕"; }
  .conferencia li.aviso::before { content: "!"; font-weight: 800; }
  .conferencia li.ok::before { content: "✓"; }
</style>
</head>
<body>
<header class="topo">
  <h1>Deckbuilder</h1>
  <nav><a href="/">Início</a><a href="/decks" class="ativo">Decks</a><a href="/jogo">Partida</a></nav>
  <select id="abrir" title="Abrir um deck salvo"><option value="">Abrir deck…</option></select>
  <button class="botao" id="novo">Novo</button>
  <span class="espaco"></span>
  <input type="text" id="nome" placeholder="Nome do deck" maxlength="80">
  <span class="dica" id="estado-deck"></span>
  <button class="botao" id="apagar" title="Apagar o deck salvo">Apagar</button>
  <button class="botao principal" id="salvar" title="Ctrl+S">Salvar</button>
</header>
<main>
  <section class="acervo">
    <div class="filtros">
      <input type="text" id="busca" placeholder="Buscar nome ou texto">
      <span class="chips" id="filtro-tipo"></span>
      <span class="chips" id="filtro-elemento"></span>
    </div>
    <div class="grade" id="grade"></div>
  </section>
  <aside class="deck" id="deck"></aside>
</main>
<script src="/web/comum.js"></script>
<script src="/web/decks.js"></script>
</body>
</html>
